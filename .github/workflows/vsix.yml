name: Package VSIX

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: wgit-vsix
          path: wgit-*.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wgit-vsix
          path: dist
      - name: Require the tag to match the VSIX version
        run: |
          file=$(ls dist/wgit-*.vsix)
          base=$(basename "$file" .vsix)
          version=${base#wgit-}
          tag=${GITHUB_REF_NAME#v}
          test "$version" = "$tag"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          gh release create "$tag" "dist/wgit-${version}.vsix" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WGit ${tag}" \
            --notes "Install wgit-${version}.vsix in Cursor or VS Code: Command Palette, then Extensions: Install from VSIX. After reload, type \`wg st\`. The status bar shows \`WGit: N\`."
